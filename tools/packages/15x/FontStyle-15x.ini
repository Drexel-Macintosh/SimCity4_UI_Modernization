; New Font descriptions as of 7/21/2003
; ----------------------------------------------------------------
; ----------------------------------------------------------------
;
; Photoshop and our font engine use different metrics for 
; drawing fonts.  only through great effort can you get a decent 
; match between them. mappings between photoshop points and game size (rounded to 
; the nearest integer):
;
; Important note: if photoshop document is set to 74.72 pixels/inch, 
; then the photoshop point sizes will sort of match the game sizes
;
; 7/21/03 - made change to fontstyle ini to adjust for a new font engine.
; The new font engine (based on Font Fusion) displays fonts differently than
; the old version based on FreeType.



